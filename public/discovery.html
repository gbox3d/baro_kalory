<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Baro Calory · 주차면 탐색</title>
<link rel="icon" href="./favicon.ico" sizes="any" />
<script>try{document.documentElement.dataset.theme=localStorage.getItem("baro-theme")||"terminal"}catch(e){}</script>
<link rel="stylesheet" href="./app.css" />
<style>
/* discovery 전용 컴포넌트 — 공유 base/컴포넌트/토큰은 /app.css 에서 온다.
   색/글꼴/반경은 전부 var(--…) 토큰 참조(테마 따라 자동 교체). */
  :root { color-scheme: dark; }
  /* 반응형 금지 — 고정폭 1200 = 좌 860 + gap 16 + 우 296 (+ 패딩 28) */
  html, body { min-width: 1200px; }
  main { padding: 0; }
  #disc-wrap { display: flex; gap: 16px; padding: 14px; width: 1200px; box-sizing: border-box; align-items: flex-start; }
  #disc-left { flex: 0 0 860px; }
  #disc-stage { position: relative; line-height: 0; background: #000; border: 1px solid var(--color-border); overflow: hidden; }
  #disc-view { display: block; width: 860px; aspect-ratio: 16 / 9; height: auto; background: #000; object-fit: contain; cursor: crosshair; }
  #disc-points { position: absolute; inset: 0; pointer-events: none; }
  #disc-home-frame { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; display: none; }
  /* 호밍 중 차량 세그멘테이션 오버레이 (프레임 좌표 → 화면 정합). */
  #disc-masks { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; display: none; }
  #disc-masks polygon.target { fill: rgba(255,90,80,.24); stroke: #ff635a; stroke-width: 4; }
  #disc-masks polygon.candidate { fill: rgba(255,174,64,.12); stroke: #ffae40; stroke-width: 3; stroke-dasharray: 12 8; }
  #disc-home-box { z-index: 4; }   /* 번호판 박스는 마스크(z2)·조준선(z3) 위 */
  #disc-home-box.locked::before { content: "PLATE LOCK"; position: absolute; left: -2px; top: -22px; padding: 2px 5px;
    background: #16d05a; color: #071108; font: 700 11px/1.3 var(--font-mono); white-space: nowrap; }
  /* 에이전트 '독백' — 화면 좌하단 녹색 모노 텍스트, 스트림 오브 콘셔스니스. */
  #disc-monologue { position: absolute; left: 12px; right: 12px; bottom: 10px; z-index: 5; pointer-events: none;
    display: flex; flex-direction: column; gap: 2px; font-family: var(--font-mono); font-size: 13px; line-height: 1.5; }
  #disc-monologue .th { color: #16d05a; text-shadow: 0 0 3px #000, 0 1px 4px #000, 0 0 8px rgba(22,208,90,.5);
    opacity: .5; transition: opacity .2s; }
  #disc-monologue .th:last-child { opacity: 1; font-weight: 600; }
  #disc-monologue .th::before { content: "› "; opacity: .7; }
  #disc-crosshair { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; z-index: 3; }
  #disc-crosshair::before { content: ""; position: absolute; left: -16px; top: -1px; width: 32px; height: 2px; background: rgba(255,90,90,.7); box-shadow: 0 0 2px #000; }
  #disc-crosshair::after { content: ""; position: absolute; left: -1px; top: -16px; width: 2px; height: 32px; background: rgba(255,90,90,.7); box-shadow: 0 0 2px #000; }
  #hr-cross::before { content: ""; position: absolute; left: -16px; top: -1px; width: 32px; height: 2px; background: rgba(255,90,90,.85); box-shadow: 0 0 2px #000; }
  #hr-cross::after { content: ""; position: absolute; left: -1px; top: -16px; width: 2px; height: 32px; background: rgba(255,90,90,.85); box-shadow: 0 0 2px #000; }
  #disc-panel { flex: 0 0 296px; display: flex; flex-direction: column; gap: 12px; }
  .pdot { position: absolute; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; border: 2px solid var(--color-accent); background: rgba(211,162,74,.4); box-shadow: 0 0 0 1px #0008; pointer-events: auto; cursor: pointer; }
  .pdot.sel { border-color: var(--color-warn); background: rgba(211,162,74,.55); width: 18px; height: 18px; margin: -9px 0 0 -9px; }
  .pdot-lab { position: absolute; left: 16px; top: -3px; font-size: 11px; color: var(--color-text); background: #000a; padding: 0 3px; white-space: nowrap; }
  /* 프리셋/점 리스트 */
  .spot-row { display: flex; gap: 6px; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--color-border); }
  .spot-row .nm { flex: 1; font-size: 13px; }
  .spot-row .pz { font-size: 11px; color: var(--color-muted); }
  .prow { cursor: pointer; }
  .prow:hover { background: rgba(255,255,255,.04); }
  .prow.sel { background: rgba(211,162,74,.12); }
  /* 선택 항목 상세 — 리스트 위에 고정, 영상 가까이. 1줄=이름/상태/위치, 2줄=동작 버튼. */
  .props { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; padding: 8px; border: 1px solid var(--color-border); border-radius: 6px; background: rgba(211,162,74,.07); }
  .props .line { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; min-height: 22px; }
  .props .pname { font-weight: 700; font-size: 13px; }
  .props .pmeta { font-size: 11px; color: var(--color-muted); }
  .props .pz { font-size: 12px; }
  .props input.pname { width: 110px; font-weight: 700; font-size: 13px; padding: 3px 6px; }
  /* 카드 타이틀 바 — 제목 왼쪽 · 상태 오른쪽 */
  .card h2.tbar { display: flex; align-items: center; gap: 8px; background: rgba(255,255,255,.04); border: 1px solid var(--color-border); border-radius: 4px; padding: 5px 8px; }
  .card h2.tbar .tstat { margin-left: auto; text-transform: none; letter-spacing: 0; font-size: 12px; text-align: right; }
</style>
</head>
<body>
<header>
  <h1>Baro Calory · 주차면 탐색 <label class="header-camera">CCTV <select id="header-camera-select" data-i18n-skip title="CCTV 선택" disabled><option>불러오는 중…</option></select></label></h1>
  <span data-role="chrome" style="display:flex; align-items:center; gap:10px;"></span>
</header>
<main>
  <div id="disc-wrap">
    <div id="disc-left">
      <div id="disc-stage" class="preview-paused" data-paused-label="정지됨">
        <img id="disc-view" class="preview-waiting-image" alt="discovery preview" title="프리셋 구도에서 영상 위를 클릭하면 주차면 점이 추가됩니다." />
        <img id="disc-home-frame" alt="homing detection frame" />
        <div id="disc-points"></div>
        <svg id="disc-masks" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
        <div id="disc-home-box" style="position:absolute; border:2px solid #16d05a; box-shadow:0 0 0 1px #000, 0 0 8px #16d05a; pointer-events:none; display:none;"></div>
        <div id="disc-crosshair" aria-hidden="true"></div>
        <div id="disc-monologue" aria-hidden="true"></div>
      </div>
      <div class="row" style="width:860px; max-width:100%;">
        <button id="disc-preview-mode">프리뷰: 스트림</button>
        <span id="disc-fps" class="hint">—</span>
        <span id="disc-ptz" class="pz"></span>
      </div>
      <div id="disc-status" class="hint"></div>
    </div>
    <div id="disc-panel">
      <div class="card">
        <h2>프리셋 (구도)</h2>
        <div class="row" style="margin-bottom:8px;"><input id="disc-name" placeholder="프리셋 이름" style="width:140px" /><button id="disc-add" title="현재 카메라 구도를 새 프리셋으로 저장">＋</button></div>
        <div id="disc-preset-props" class="props"><span class="pmeta">프리셋을 선택하세요.</span></div>
        <div id="disc-list"><span class="hint">아직 프리셋 없음</span></div>
      </div>
      <div class="card">
        <h2 class="tbar">주차면 점 <span id="disc-pt-label" class="hint"></span><span id="disc-home-status" class="tstat hint">대기 중</span></h2>
        <div class="row" style="margin-bottom:8px; gap:8px; align-items:center; flex-wrap:wrap;">
          <button id="disc-vlm" title="현재 프레임의 주차 차량을 VLM으로 자동 검출해 점으로 추가">VLM 주차인식</button>
          <label class="hint" title="자동 검출 시 기존 점을 지우고 교체" style="display:flex; align-items:center; gap:4px;"><input type="checkbox" id="disc-vlm-replace" style="width:auto;" /> 교체</label>
          <button id="disc-home-start" title="모든 점을 순회하며 번호판까지 줌인 호밍">번호판 호밍</button>
          <button id="disc-home-stop" disabled>중지</button>
          <button id="disc-clear" title="이 프리셋의 주차면 점 전체 삭제" style="margin-left:auto;">전체 삭제</button>
        </div>
        <div id="disc-point-props" class="props"><span class="pmeta">점을 선택하세요.</span></div>
        <div id="disc-ptlist" title="녹색=호밍 성공 · 파랑=번호판 확인 불가 · 노랑=판정 보류/처리중 · 빨강=실패" style="max-height:340px; overflow-y:auto;"><span class="hint">프리셋을 선택하세요.</span></div>
      </div>
    </div>
  </div>

  <!-- 번호판 호밍 과정 다시보기: 스텝별 프레임 + LPD 후보/선택 박스 + 중앙 십자/반경 -->
  <div id="home-replay" style="display:none; position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.78); align-items:center; justify-content:center;">
    <div style="background:#11151b; border:1px solid #2a2f38; border-radius:8px; padding:14px; width:820px; max-width:96vw;">
      <div class="row" style="justify-content:space-between; align-items:center; margin-bottom:8px;">
        <b id="hr-title">호밍 과정</b>
        <button id="hr-close">닫기 ✕</button>
      </div>
      <div id="hr-stage" style="position:relative; line-height:0; background:#000; border:1px solid #2a2f38; border-radius:6px; overflow:hidden; aspect-ratio:16/9;">
        <img id="hr-img" alt="step frame" style="display:block; width:100%; height:100%; object-fit:contain; background:#000;" />
        <div id="hr-overlay" style="position:absolute; inset:0; pointer-events:none;"></div>
        <div id="hr-cross" style="position:absolute; left:50%; top:50%; width:0; height:0; pointer-events:none;"></div>
      </div>
      <div id="hr-caption" class="hint" style="margin:8px 0; min-height:18px;">—</div>
      <div class="row" style="gap:8px; align-items:center;">
        <button id="hr-prev">◀ 이전</button>
        <span id="hr-pos" class="pz">—</span>
        <button id="hr-next">다음 ▶</button>
        <button id="hr-play">▶ 자동재생</button>
        <span class="hint" style="margin-left:auto;" data-i18n-html="replay.legend">흰 박스=후보 LP · <span style="color:#16d05a">녹색=선택</span> · 빨강 십자=중앙</span>
      </div>
    </div>
  </div>
</main>

<script type="module">
import { getJson, postJson, reqJson, fmtPtz as fmt, api, asset } from "./web/api.mjs";
import { createCameraPreview } from "./web/camera-preview.mjs";
import { applyI18n, t } from "./web/i18n.mjs";
import { initPageChrome } from "./web/page-chrome.mjs";
import { createCameraSelect } from "./web/camera-select.mjs";

initPageChrome({ page: "discovery" });

// 좌하단 상태줄이 이 페이지의 로그다 — 제어 콘솔의 #log 패널은 그 페이지 소유다.
const statusEl = document.getElementById("disc-status");
function log(msg) { statusEl.textContent = msg; }

// PTZ 는 이 페이지가 직접 폴링한다. 제어 콘솔의 loopPtz 에 얹혀 있던 시절엔 탭 가드가
// 필요했지만 페이지가 되면 자기 것만 본다. 숨겨졌을 때 카메라를 깨우지 않는 규칙은 유지 —
// 가드가 없던 시절 아무도 안 보는 탭 하나가 하루 10만 건 넘게 카메라 HTTP 를 두드렸다.
const ptzEl = document.getElementById("disc-ptz");
let lastPtz = null;
async function loopPtz() {
  if (document.hidden) { setTimeout(loopPtz, 800); return; }
  try {
    lastPtz = await getJson(api("/ptz"));
    ptzEl.textContent = t("현재 {p}", { p: fmt(lastPtz) });
  } catch (e) {
    // 절대 좌표가 없는 계열(IDIS 등)은 위치를 못 주는 것이 **설계**다 — 그걸 "읽기 실패"로
    // 부르면 정상 동작을 고장으로 오인하게 만든다. 능력 부재(501)와 진짜 장애를 구분한다.
    lastPtz = null;
    ptzEl.textContent = e.status === 501
      ? t("이 기기는 위치를 알려주지 않습니다 (상대 이동 전용)")
      : t("읽기 실패") + ": " + e.message;
  }
  refreshDiscPoints();
  setTimeout(loopPtz, 800);
}

// 잡이 카메라를 모는 동안 다른 조작을 막는다. 카메라 전환도 함께 잠근다 — 잡이 몰고 있는
// 카메라를 갈아타면 실기가 엉뚱하게 움직이고 결과가 다른 기기 것으로 섞인다.
function setBusy(on, label) {
  statusEl.textContent = on ? t(label || "카메라 이동 중…") : "";
  document.querySelectorAll("button").forEach((b) => { b.disabled = on; });
  cam.setEnabled(!on);
}

// =====================================================================
// =====================================================================
// 주차면 탐색: 프리셋(구도) CRUD + 그 구도에서 점(x,y)으로 주차면 지정 CRUD.
// 점 = 프리셋의 1920x1080 뷰 픽셀 좌표. (영역/관찰/확정주차면 기능은 제거됨.)
// =====================================================================
const discView = document.getElementById("disc-view");
const discPoints = document.getElementById("disc-points");
const discList = document.getElementById("disc-list");
const discStatus = document.getElementById("disc-status");
const discPtList = document.getElementById("disc-ptlist");
const discPtLabel = document.getElementById("disc-pt-label");

let discPresets = [];
// 호밍 프레임 URL의 첫 세그먼트. 프리셋 목록/호밍 상태 응답이 알려준다(서버가 진실의 출처).
// 카메라마다 점 id가 겹치므로 이게 없으면 다른 카메라 프레임을 불러온다.
let discCameraId = null;
let discSelPresetId = null;   // 선택된 preset (편집/조준 대상 구도)
let discPts = [];              // 선택 preset의 주차면 점들
let discSelPointId = null;
let discAtPreset = false;

const discoveryPreview = createCameraPreview({
  img: discView,
  modeButton: document.getElementById("disc-preview-mode"),
  fpsLabel: document.getElementById("disc-fps"),
  storageKey: "discovery",
  log,
});

function discSelPreset() { return discPresets.find((p) => p.id === discSelPresetId) || null; }
function clampN(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
// Mouse -> fixed 1920x1080 frame coords (proportion-exact for snapshot or downscaled stream).
function dpt(e) {
  const rect = discView.getBoundingClientRect();
  const px = e.clientX - rect.left, py = e.clientY - rect.top;
  return { x: Math.round(clampN(px / rect.width * 1920, 0, 1920)), y: Math.round(clampN(py / rect.height * 1080, 0, 1080)) };
}
function ptzNear(a, b, tolPT = 150, tolZ = 1500) {
  if (!a || !b) return false;
  const pan = Math.min(Math.abs(a.panpos - b.panpos), 36000 - Math.abs(a.panpos - b.panpos));
  return pan <= tolPT && Math.abs(a.tiltpos - b.tiltpos) <= tolPT && Math.abs((a.zoompos || 0) - (b.zoompos || 0)) <= tolZ;
}
function atSelectedPreset() {
  const p = discSelPreset();
  return !!(p && p.ptz && ptzNear(lastPtz, p.ptz));
}

async function loadDiscovery() {
  await loadDiscPresets();
  resumeHoming();
}
// 페이지 로드 시엔 '진행 중(running)'인 잡에만 다시 붙는다. 이미 끝난 잡(이전 세션/테스트 잔재)은
// 배너로 되살리지 않고 '대기 중'으로 둔다 — 결과는 점 행의 영속 색(lprStatus)과 속성창 '과정'이 보여준다.
async function resumeHoming() {
  let st;
  try { st = await getJson(api("/discovery/plate-home/status")); } catch { return; }
  if (st.state === "running") {
    document.getElementById("disc-home-start").disabled = true;
    document.getElementById("disc-home-stop").disabled = false;
    pollHoming();
  } else {
    document.getElementById("disc-home-status").textContent = t("대기 중");
    homeBox(null); homeLive = null; renderDiscPtList();
  }
}

async function loadDiscPresets() {
  try {
    const d = await getJson(api("/discovery/presets"));
    if (d.cameraId) discCameraId = d.cameraId;
    discPresets = d.presets || [];
    if (discSelPresetId && !discPresets.find((p) => p.id === discSelPresetId)) discSelPresetId = null;
    renderDiscPresets();
    await loadPoints();
  } catch (e) { discStatus.textContent = t("프리셋 로드 실패") + ": " + e.message; }
}

function renderDiscPresets() {
  discList.replaceChildren();
  renderPresetProps();
  if (!discPresets.length) { discList.innerHTML = '<span class="hint">아직 프리셋 없음 — 카메라 구도를 맞춘 뒤 추가하세요.</span>'; applyI18n(discList); return; }
  for (const p of discPresets) {
    // 리스트 행은 이름 + 점 개수만. 선택/이동은 행 클릭, 편집·삭제는 아래 속성창에서.
    const row = document.createElement("div"); row.className = "spot-row prow" + (p.id === discSelPresetId ? " sel" : "");
    row.title = t("클릭하면 이 프리셋을 선택하고 그 구도로 이동합니다.");
    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = p.name;
    const cnt = document.createElement("span"); cnt.className = "pz"; cnt.textContent = (p.points && p.points.length) ? t("{n}점", { n: p.points.length }) : "";
    row.append(nm, cnt);
    row.addEventListener("click", () => selectDiscPreset(p.id, true));
    discList.appendChild(row);
  }
  applyI18n(discList);
}
// 프리셋 디테일 뷰 (리스트 위 고정) — 1줄: 이름·점 개수 / 2줄: 이동·이름·삭제.
function renderPresetProps() {
  const box = document.getElementById("disc-preset-props");
  box.replaceChildren();
  const p = discSelPreset();
  if (!p) { const e = document.createElement("span"); e.className = "pmeta"; e.textContent = t("프리셋을 선택하세요."); box.appendChild(e); return; }
  const l1 = document.createElement("div"); l1.className = "line";
  const nm = document.createElement("input"); nm.className = "pname"; nm.value = p.name; nm.title = t("이름 수정 (Enter로 저장)");
  nm.addEventListener("keydown", (e) => { if (e.key === "Enter") nm.blur(); });
  nm.addEventListener("change", () => renameDiscPresetTo(p, nm.value));
  const meta = document.createElement("span"); meta.className = "pmeta";
  meta.textContent = (p.points && p.points.length) ? t("{n}점", { n: p.points.length }) : t("점 없음");
  l1.append(nm, meta);
  const l2 = document.createElement("div"); l2.className = "line";
  const go = document.createElement("button"); go.textContent = t("이동"); go.title = t("이 프리셋 구도로 카메라 이동"); go.addEventListener("click", () => selectDiscPreset(p.id, true));
  const del = document.createElement("button"); del.textContent = t("삭제"); del.addEventListener("click", () => delDiscPreset(p.id, p.name));
  l2.append(go, del);
  box.append(l1, l2);
}

async function addDiscPreset() {
  const name = document.getElementById("disc-name").value.trim();
  try {
    const j = await postJson(api("/discovery/presets"), { name: name || undefined });
    document.getElementById("disc-name").value = "";
    discSelPresetId = j.preset ? j.preset.id : discSelPresetId;

  } catch (e) { discStatus.textContent = t("추가 실패") + ": " + e.message; }
}

// VLM(클로드 등)으로 현재 프레임의 주차된 차를 자동 검출해 점으로 추가.
async function vlmAutoDetect() {
  if (!discSelPresetId) { discStatus.textContent = t("먼저 프리셋을 선택하세요."); return; }
  if (!atSelectedPreset()) await selectDiscPreset(discSelPresetId, true);  // 정렬 위해 프리셋 구도로 이동 (정합 최종판정은 서버 409가)

    const j = await postJson(api("/discovery/presets/") + discSelPresetId + "/auto-detect", { replace });

    discStatus.textContent = t("VLM({prov}·{model}) 주차인식: 점 {c}개 {act}.", { prov: j.provider, model: j.model, c: j.count, act: replace ? t("교체") : t("추가") });

// --- 번호판 호밍: 전체 점 줌인 호밍 + 라이브 상태/LPD 박스 ---
let homePollTimer = null;
let homeLive = null; // { results:{pointId->result}, currentId } — 진행 중 공유 리스트 색표기용
// (구 탐색반경 원 오버레이는 제거 — 신원 고정은 세그멘테이션 마스크가 담당, 마스크 오버레이가 대신 보여준다.)

// 선택한 한 점만 (재)호밍 — pointIds로 그 점만 서버에 전달.

}

// --- 호밍 과정 다시보기 (스텝별 프레임 리플레이) ---
let hrState = null; // { steps, presetId, pointId, i, timer }
function openHomeReplay(q) {
  if (!(q.homeSteps && q.homeSteps.length)) { discStatus.textContent = t("이 점은 과정 기록이 없습니다."); return; }
  if (hrState && hrState.timer) clearInterval(hrState.timer);
  hrState = { steps: q.homeSteps, presetId: discSelPresetId, pointId: q.id, i: 0, timer: null };
  document.getElementById("hr-title").textContent = t("점 '{name}' 번호판 호밍 과정 — {n}스텝", { name: q.name, n: q.homeSteps.length });
  document.getElementById("hr-play").textContent = t("▶ 자동재생");
  document.getElementById("home-replay").style.display = "flex";
  renderReplayStep();
}
function closeHomeReplay() {
  if (hrState && hrState.timer) clearInterval(hrState.timer);
  hrState = null;
  document.getElementById("home-replay").style.display = "none";
  document.getElementById("hr-img").removeAttribute("src");
}
function replayNav(d) { if (!hrState) return; hrState.i = Math.max(0, Math.min(hrState.steps.length - 1, hrState.i + d)); renderReplayStep(); }
function renderReplayStep() {
  if (!hrState) return;
  const st = hrState.steps[hrState.i], total = hrState.steps.length;
  const img = document.getElementById("hr-img");
  if (st.frame != null && discCameraId) { img.style.visibility = "visible"; img.src = asset(`/home-frame/${discCameraId}/${hrState.presetId}/${hrState.pointId}/${st.frame}`); }
  else { img.style.visibility = "hidden"; img.removeAttribute("src"); }
  const ov = document.getElementById("hr-overlay"); ov.replaceChildren();
  const pct = (v, hi) => Math.max(0, Math.min(100, v / hi * 100));
  const mkBox = (b, color, w) => { const d = document.createElement("div"); d.style.cssText = `position:absolute; box-sizing:border-box; border:${w}px solid ${color}; box-shadow:0 0 0 1px rgba(0,0,0,.6); left:${pct(b[0],1920)}%; top:${pct(b[1],1080)}%; width:${pct(b[2],1920)-pct(b[0],1920)}%; height:${pct(b[3],1080)-pct(b[1],1080)}%;`; return d; };
  const isPick = (b) => st.pick && b[0] === st.pick[0] && b[1] === st.pick[1] && b[2] === st.pick[2] && b[3] === st.pick[3];
  for (const b of (st.boxes || [])) { if (!isPick(b)) ov.appendChild(mkBox(b, "rgba(255,255,255,.6)", 1)); }
  if (st.pick) ov.appendChild(mkBox(st.pick, "#16d05a", 2));
  let cap = st.found
    ? t("스텝 <b>{step}</b> · z{z} · 판폭 <b>{w}px</b>", { step: st.step, z: st.zoom, w: st.plateW })
    : t("스텝 <b>{step}</b> · z{z} · <span style=\"color:#e0556b\">번호판 없음(후보 {n})</span>", { step: st.step, z: st.zoom, n: (st.boxes || []).length });
  if (st.vlm) {
    const v = st.vlm;
    let verdict;
    if (v.index === null || v.index === undefined) verdict = `${v.reason || t("기하 폴백")}`;
    else if (v.index >= 0) verdict = t("내 차 판 선택(#{i})", { i: v.index }) + " — " + (v.reason || "");
    else if (st.approach) verdict = t("접근 시도(부분/소형 판 — 더 가까이)") + " — " + (v.reason || "");
    else verdict = t("내 차 판 없음(드리프트 차단)") + " — " + (v.reason || "");
    cap += `<br><span style="color:#e8c33a">${t("선비(VLM):")} ${verdict}</span>`;
  }
  if (st.segment) {
    const s = st.segment;
    const verdict = s.vpdSkipped
      ? (st.found ? t("번호판 잠금 후 LPD 추적 재확인") : t("번호판 추적 재확인 실패"))
      : (st.found ? t("타깃 차량 마스크 내부 번호판 1개") : t("차량 마스크/번호판 소속 미확정"));
    const detail = s.vpdSkipped
      ? t("VPD 생략 · LPD 후보 {p}", { p: s.plateCandidates })
      : t("중앙 마스크 {m} · 내부 판 {p}", { m: s.centerMasks, p: s.plateCandidates });
    cap += `<br><span style="color:#68c8ff">${t("차량 세그멘테이션:")} ${verdict} · ${detail}</span>`;
  }
  if (st.visibility) {
    const v = st.visibility;
    const verdict = {
      plate_visible: t("번호판 면이 보임"),
      plate_occluded: t("번호판 영역이 가려짐"),
      plate_side_not_visible: t("번호판이 있는 면이 보이지 않음"),
      uncertain: t("판정 보류"),
    }[v.verdict] || t("판정 보류");
    const evidence = escapeHtml(v.evidence || "");
    cap += `<br><span style="color:#b7a4ff">${t("최종 가시성 판정:")} ${verdict} · ${escapeHtml(v.confidence || "-")}${evidence ? ` — ${evidence}` : ""}</span>`;
  }
  document.getElementById("hr-caption").innerHTML = cap;
  document.getElementById("hr-pos").textContent = `${hrState.i + 1} / ${total}`;
}
function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
}
function replayPlay() {
  if (!hrState) return;
  const btn = document.getElementById("hr-play");
  if (hrState.timer) { clearInterval(hrState.timer); hrState.timer = null; btn.textContent = t("▶ 자동재생"); return; }
  if (hrState.i >= hrState.steps.length - 1) hrState.i = 0; // 끝이면 처음부터
  renderReplayStep();
  btn.textContent = t("⏸ 정지");
  hrState.timer = setInterval(() => {
    if (!hrState) return;
    if (hrState.i >= hrState.steps.length - 1) { clearInterval(hrState.timer); hrState.timer = null; btn.textContent = t("▶ 자동재생"); return; }
    hrState.i++; renderReplayStep();
  }, 1100);
}
document.getElementById("hr-close").addEventListener("click", closeHomeReplay);
document.getElementById("hr-prev").addEventListener("click", () => replayNav(-1));
document.getElementById("hr-next").addEventListener("click", () => replayNav(1));
document.getElementById("hr-play").addEventListener("click", replayPlay);
document.getElementById("home-replay").addEventListener("click", (e) => { if (e.target.id === "home-replay") closeHomeReplay(); });

async function stopHoming() {
  try { await postJson(api("/discovery/plate-home/stop"), {}); document.getElementById("disc-home-stop").disabled = true; pollHoming(); }
  catch (e) { discStatus.textContent = t("중지 실패") + ": " + e.message; }
}
function homeBox(plate, locked = false) {
  const box = document.getElementById("disc-home-box");
  box.classList.toggle("locked", locked);
  if (!(plate && plate.length === 4) || plate[2] <= plate[0] || plate[3] <= plate[1]) { box.style.display = "none"; return; }
  const cl = (v, hi) => Math.max(0, Math.min(100, v / hi * 100));
  box.style.left = cl(plate[0], 1920) + "%"; box.style.top = cl(plate[1], 1080) + "%";
  box.style.width = (cl(plate[2], 1920) - cl(plate[0], 1920)) + "%"; box.style.height = (cl(plate[3], 1080) - cl(plate[1], 1080)) + "%";
  box.style.display = "block";
}
// 차량 세그멘테이션 마스크 오버레이 — 운영 화면에는 확정 타깃 또는 모호 후보만 표시한다.
const SVGNS = "http://www.w3.org/2000/svg";
function renderMasks(overlay) {
  const { targetMask, candidateMasks, maskState } = overlay || {};
  const svg = document.getElementById("disc-masks");
  svg.replaceChildren();
  if (maskState === "track_lost") { svg.style.display = "none"; return; }
  const append = (poly, className) => {
    if (!Array.isArray(poly) || poly.length < 3) return;
    const el = document.createElementNS(SVGNS, "polygon");
    el.setAttribute("points", poly.map((p) => `${p[0]},${p[1]}`).join(" "));
    el.setAttribute("class", className);
    svg.appendChild(el);
  };
  if (maskState === "target_acquire" || maskState === "plate_locked") {
    append(targetMask, "target");
  } else if (maskState === "target_ambiguous") {
    for (const poly of candidateMasks || []) append(poly, "candidate");
  }
  svg.style.display = svg.childElementCount ? "block" : "none";
}
// 에이전트 '독백' — 단계가 바뀔 때마다 한 줄씩 누적(최근 5줄), 화면에 녹색 오버레이.
let monoThoughts = [], monoLastKey = null;
function pushThought(text, key) {
  if (!text) return;
  const k = key != null ? String(key) : text;
  if (k === monoLastKey) return;      // 같은 단계 반복 — 중복 줄 방지
  monoLastKey = k;
  monoThoughts.push(text);
  if (monoThoughts.length > 5) monoThoughts = monoThoughts.slice(-5);
  renderMonologue();
}
function clearThoughts() { monoThoughts = []; monoLastKey = null; renderMonologue(); }
function renderMonologue() {
  const box = document.getElementById("disc-monologue");
  box.replaceChildren();
  for (const th of monoThoughts) { const d = document.createElement("div"); d.className = "th"; d.textContent = th; box.appendChild(d); }
}
// 호밍 중: 검출한 '바로 그 스냅샷'을 라이브 뷰에 띄워 박스와 정합(스트림 lag 제거). 끝나면 숨겨 스트림 복귀.
function setHomeFrame(st, c) {
  const f = document.getElementById("disc-home-frame");
  const pts = document.getElementById("disc-points");
  if (st && st.state === "running" && c && c.step != null && c.pointId && (st.cameraId || discCameraId)) {
    const url = asset(`/home-frame/${st.cameraId || discCameraId}/${st.presetId}/${c.pointId}/${c.step}`);
    if (f.getAttribute("src") !== url) f.src = url; // 같은 프레임 반복 로드 방지(깜빡임)
    f.style.display = "block";
    if (pts) pts.style.display = "none"; // 와이드 점 오버레이는 줌 뷰에 안 맞아 호밍 중 숨김
  } else {
    f.style.display = "none"; f.removeAttribute("src");
    if (pts) pts.style.display = "";
  }
}
async function pollHoming() {
  if (homePollTimer) { clearTimeout(homePollTimer); homePollTimer = null; }
  let st;
  try { st = await getJson(api("/discovery/plate-home/status")); }
  catch (e) {
    document.getElementById("disc-home-start").disabled = false;
    document.getElementById("disc-home-stop").disabled = true;
    discStatus.textContent = t("호밍 상태 조회 실패(재시도 중)") + ": " + e.message;
    homePollTimer = setTimeout(pollHoming, 2000); return;
  }
  renderHome(st);
  if (st.state === "running") { homePollTimer = setTimeout(pollHoming, 250); return; }
  homeBox(null);
  document.getElementById("disc-home-start").disabled = false;
  document.getElementById("disc-home-stop").disabled = true;
  if (st.state === "done" || st.state === "stopped" || st.state === "failed") await loadDiscPresets();
}
function renderHome(st) {
  const s = document.getElementById("disc-home-status");
  if (!st || st.state === "idle") { s.textContent = t("대기 중"); homeBox(null); renderMasks(null); clearThoughts(); setHomeFrame(null, null); homeLive = null; renderDiscPtList(); return; }
  const c = st.current;
  if (st.state === "running" && c) {
    // 타이틀 바 = 진행 카운트만 간결하게. 세부 과정 서사는 화면 독백 오버레이로.
    s.innerHTML = `${t("호밍 중")} · <b>${st.currentIdx + 1}/${st.total}</b> · ${t("점")} '${c.name || "?"}'`;
    setHomeFrame(st, c); // 라이브 뷰를 검출 프레임으로 → 박스 정합
    homeBox(c.plate, c.maskState === "plate_locked");
    // 마스크는 검출 프레임 좌표 — 프레임이 실제로 떠 있을 때만(setHomeFrame과 같은 게이트).
    renderMasks(c.step != null ? c : null);
    // 독백 중복 억제는 '문장 내용' 기준 — step/phase 키는 검출→재조준 전이에서 충돌한다.
    pushThought(c.thought, `${c.pointId}:${c.thought}`);
  } else {
    const results = st.results || [];
    const counts = Object.fromEntries(["ok", "unavailable", "uncertain", "failed"].map((key) => [key, results.filter((r) => r.status === key).length]));
    const stateLabel = st.state === "done" ? t("완료") : st.state === "stopped" ? t("중지됨") : st.state;
    const summary = `${t("성공")} ${counts.ok} · ${t("확인 불가")} ${counts.unavailable} · ${t("보류")} ${counts.uncertain} · ${t("실패")} ${counts.failed}`;
    s.textContent = `${stateLabel} · ${summary}` + (st.error ? ` · ${st.error}` : "") + (st.cameraStranded ? t(" · 카메라 복귀 실패(수동 확인 필요)") : "");
    pushThought(`${t("호밍 종료")} — ${summary}`, "__end__");
    renderMasks(null);                                  // 스트림 복귀 → 마스크는 정합 안 되니 제거
    setHomeFrame(null, null); // 끝나면 라이브 스트림 복귀 + 점 오버레이 복원
  }
  // 진행 결과를 공유 점 목록에 실시간 색표기 (처리중은 running일 때만 — done 중 stale 방지)
  homeLive = { results: {}, currentId: (st.state === "running" && c) ? c.pointId : null };
  for (const r of (st.results || [])) homeLive.results[r.pointId] = r;
  renderDiscPtList();
}

// 호밍된 점의 저장된 closeupPtz로 단번에 이동 — 번호판 확대해서 보기
async function viewPlate(q) {
  if (!q.closeupPtz) { discStatus.textContent = t("이 점은 아직 번호판 호밍이 안 됐습니다."); return; }

    const j = await postJson(api("/ptz"), { panpos: q.closeupPtz.panpos, tiltpos: q.closeupPtz.tiltpos, zoompos: q.closeupPtz.zoompos });
    if (j.ptz) { lastPtz = j.ptz; ptzEl.textContent = fmt(j.ptz); }
    discStatus.textContent = t("점 '{name}' 번호판 보기 — z{z} · {px}px (프리셋을 클릭하면 와이드 복귀).", { name: q.name, z: (j.ptz && j.ptz.zoompos) || "?", px: q.platePx || "?" });
  } catch (e) { discStatus.textContent = t("번호판 보기 실패") + ": " + e.message; }

}

// 디테일 뷰 인라인 이름 편집 — 빈 값/변경 없음은 무시.
async function renameDiscPresetTo(p, name) {
  name = String(name || "").trim();
  if (!name || name === p.name) { renderPresetProps(); return; }
  try { await reqJson("PUT", api("/discovery/presets/") + p.id, { name }); await loadDiscPresets(); }
  catch (e) { discStatus.textContent = t("이름 변경 실패") + ": " + e.message; }
}

async function delDiscPreset(id, name) {
  if (!confirm(t("프리셋 '{name}'을(를) 삭제할까요? (그 안의 점들도 함께 삭제)", { name }))) return;
  try {
    await reqJson("DELETE", api("/discovery/presets/") + id);
    if (discSelPresetId === id) { discSelPresetId = null; discPts = []; }
    await loadDiscPresets();
  } catch (e) { discStatus.textContent = t("삭제 실패") + ": " + e.message; }
}

async function selectDiscPreset(id, doGoto) {
  discSelPresetId = id; discSelPointId = null;
  const p = discSelPreset();
  discPtLabel.textContent = p ? ("· " + p.name) : "";
  renderDiscPresets();
  await loadPoints();
  if (doGoto && p) {
    setBusy(true, "프리셋으로 이동 중…");

      if (j.ptz) { lastPtz = j.ptz; ptzEl.textContent = fmt(j.ptz); }
      renderDiscPoints();
      discStatus.textContent = t("'{name}' 구도. 영상 위를 클릭해 주차면 점을 찍으세요.", { name: p.name });
    } catch (e) { discStatus.textContent = t("이동 실패") + ": " + e.message; }
    finally { setBusy(false); }
  }
}

// --- 주차면 점(points) CRUD ---
async function loadPoints() {
  if (!discSelPresetId) { discPts = []; renderDiscPoints(); return; }
  try {
    discPts = (await getJson(api("/discovery/presets/") + discSelPresetId + "/points")).points || [];
    if (discSelPointId && !discPts.find((q) => q.id === discSelPointId)) discSelPointId = null;
    // 프리셋 행의 'N점' 배지·속성창 개수를 점 추가/삭제 직후에도 동기화 (재조회 없이 인라인 갱신).
    const sp = discSelPreset();
    if (sp) { sp.points = discPts; renderDiscPresets(); }
    renderDiscPoints();
  } catch (e) { discStatus.textContent = t("점 로드 실패") + ": " + e.message; }
}
function refreshDiscPoints() {
  if (atSelectedPreset() !== discAtPreset) renderDiscPoints();
}
function renderDiscPoints() {
  discPoints.replaceChildren();
  discAtPreset = atSelectedPreset();
  if (discAtPreset) {
    for (const q of discPts) {
      const dot = document.createElement("div");
      dot.className = "pdot" + (q.id === discSelPointId ? " sel" : "");
      const dpx = String(q.lprStatus || "").startsWith("ok") && q.homedPixel
        ? q.homedPixel : { x: q.x, y: q.y };  // 성공한 호밍만 재투영 위치로 그림
      dot.style.left = (dpx.x / 1920 * 100) + "%";
      dot.style.top = (dpx.y / 1080 * 100) + "%";
      if (q.lprStatus) dot.style.background = homeStatusColor(parseStoredHomeStatus(q.lprStatus).status);
      dot.title = `${q.name} (${dpx.x},${dpx.y})` + (q.platePx ? ` · ${q.platePx}px` : "");
      const lab = document.createElement("span"); lab.className = "pdot-lab"; lab.textContent = q.name;
      dot.appendChild(lab);
      dot.addEventListener("mousedown", (e) => { e.stopPropagation(); e.preventDefault(); selectPoint(q.id); });
      discPoints.appendChild(dot);
    }
  }
  renderDiscPtList();
}
const HOME_STATUS_COLORS = { ok: "#16d05a", unavailable: "#68c8ff", uncertain: "#e8c33a", failed: "#e0556b" };
function homeStatusColor(status) { return HOME_STATUS_COLORS[status] || "#8a9099"; }
function parseStoredHomeStatus(value) {
  const raw = String(value || "");
  if (!raw) return { status: null, code: null };
  if (raw.startsWith("ok")) return { status: "ok", code: null };
  const split = raw.indexOf(":");
  const status = split >= 0 ? raw.slice(0, split) : "failed";
  const code = split >= 0 ? raw.slice(split + 1) : null;
  return { status: HOME_STATUS_COLORS[status] ? status : "failed", code };
}
function homeStatusLabel(status, code, reason, platePx) {
  if (status === "ok") return t("성공") + (platePx ? ` ${platePx}px` : "");
  if (status === "unavailable") return t("번호판 확인 불가");
  if (status === "uncertain") return code === "target_ambiguous" ? t("타깃 판정 보류") : t("판정 보류");
  if (status === "failed" && code === "detector_miss") return t("검출기 누락");
  if (status === "failed" && code === "detector_error") return t("검출기 오류");
  if (status === "failed" && code === "target_lost") return t("타깃 추적 상실");
  return reason || t("실패");
}
// 점 호밍 상태 판정: 진행중(live) 우선, 없으면 저장된 lprStatus.
function pointHomeStatus(q) {
  const live = homeLive && homeLive.results[q.id];
  const isCur = !!(homeLive && homeLive.currentId === q.id);
  const stored = parseStoredHomeStatus(q.lprStatus);
  const hstat = live ? live.status : stored.status;
  const hcode = live ? live.code : stored.code;
  const hreason = live ? live.reason : null;
  const hpx = live ? live.platePx : q.platePx;
  return { isCur, hstat, hcode, hreason, hpx };
}
function renderDiscPtList() {
  discPtList.replaceChildren();
  renderPointProps();
  if (!discSelPresetId) { discPtList.innerHTML = '<span class="hint">프리셋을 선택하세요.</span>'; applyI18n(discPtList); return; }
  if (!discPts.length) { discPtList.innerHTML = '<span class="hint">아직 점 없음 — 프리셋 구도에서 영상을 클릭하세요.</span>'; applyI18n(discPtList); return; }
  for (const q of discPts) {
    // 리스트 행 = 이름 + 위치. 호밍 상태(성공/실패/처리중)는 위치 글씨색으로. 액션은 위 디테일 뷰.
    const row = document.createElement("div"); row.className = "spot-row prow" + (q.id === discSelPointId ? " sel" : "");
    const nm = document.createElement("span"); nm.className = "nm"; nm.textContent = q.name;
    const pz = document.createElement("span"); pz.className = "pz"; pz.textContent = `(${q.x},${q.y})`;
    const { isCur, hstat, hpx } = pointHomeStatus(q);
    if (isCur) { pz.style.color = "#e8c33a"; row.style.borderLeft = "3px solid #e8c33a"; }
    else if (hstat) { const color = homeStatusColor(hstat); pz.style.color = color; row.title = hstat === "ok" ? `${hpx || "?"}px` : ""; row.style.borderLeft = `3px solid ${color}`; }
    row.append(nm, pz);
    row.addEventListener("click", () => selectPoint(q.id));
    discPtList.appendChild(row);
  }
  applyI18n(discPtList);
}
// 점 디테일 뷰 (리스트 위 고정) — 1줄: 이름·호밍상태(색)·위치 / 2줄: 액션 버튼.
function renderPointProps() {
  const box = document.getElementById("disc-point-props");
  box.replaceChildren();
  const q = discSelPresetId ? discPts.find((p) => p.id === discSelPointId) : null;
  if (!q) { const e = document.createElement("span"); e.className = "pmeta"; e.textContent = t("점을 선택하세요."); box.appendChild(e); return; }
  const { isCur, hstat, hcode, hreason, hpx } = pointHomeStatus(q);
  const l1 = document.createElement("div"); l1.className = "line";
  const nm = document.createElement("input"); nm.className = "pname"; nm.value = q.name; nm.title = t("이름 수정 (Enter로 저장)");
  nm.addEventListener("keydown", (e) => { if (e.key === "Enter") nm.blur(); });
  nm.addEventListener("change", () => renamePointTo(q, nm.value));
  const st = document.createElement("span"); st.className = "pz";
  if (isCur) { st.style.color = "#e8c33a"; st.textContent = t("처리중"); }
  else if (hstat) { st.style.color = homeStatusColor(hstat); st.textContent = homeStatusLabel(hstat, hcode, hreason, hpx); }
  else { st.textContent = t("미호밍"); }
  const pos = document.createElement("span"); pos.className = "pmeta"; pos.textContent = `(${q.x},${q.y})`;
  l1.append(nm, st, pos);
  const l2 = document.createElement("div"); l2.className = "line";
  const mk = (label, title, fn) => { const b = document.createElement("button"); b.textContent = t(label); if (title) b.title = title; b.addEventListener("click", fn); return b; };
  l2.append(mk("조준", t("이 점을 화면 중앙으로 조준"), () => aimPoint(q)));
  l2.append(mk("호밍", q.closeupPtz ? t("이 점만 다시 번호판 호밍") : t("이 점만 번호판 호밍"), () => homeOne(q)));
  if (q.closeupPtz) l2.append(mk("번호판", t("번호판 확대 보기 (z{z})", { z: q.closeupPtz.zoompos }), () => viewPlate(q)));
  if (q.homeSteps && q.homeSteps.length) l2.append(mk("과정", t("호밍 줌인 과정 다시보기 ({n}스텝)", { n: q.homeSteps.length }), () => openHomeReplay(q)));
  l2.append(mk("삭제", null, () => deletePoint(q.id)));
  box.append(l1, l2);
}
// 이 프리셋의 점 전체 삭제 (리스트 벌크 액션).
async function clearAllPoints() {
  if (!discSelPresetId) { discStatus.textContent = t("먼저 프리셋을 선택하세요."); return; }
  if (!discPts.length) { discStatus.textContent = t("삭제할 점이 없습니다."); return; }
  if (!confirm(t("이 프리셋의 주차면 점 {n}개를 모두 삭제할까요?", { n: discPts.length }))) return;
  try {
    const j = await reqJson("DELETE", api("/discovery/presets/") + discSelPresetId + "/points");
    discSelPointId = null;
    await loadDiscPresets();
    discStatus.textContent = t("점 {n}개 삭제됨.", { n: (j && j.removed) || 0 });
  } catch (e) { discStatus.textContent = t("삭제 실패") + ": " + e.message; }
}
function selectPoint(id) { discSelPointId = (discSelPointId === id ? null : id); renderDiscPoints(); }
async function addPoint(x, y) {
  if (!discSelPresetId) { discStatus.textContent = t("먼저 프리셋을 선택하세요."); return; }
  if (!atSelectedPreset()) { discStatus.textContent = t("프리셋 구도에서만 점을 찍을 수 있습니다. (프리셋을 클릭해 이동)"); return; }
  try {
    const j = await postJson(api("/discovery/presets/") + discSelPresetId + "/points", { x, y });
    discSelPointId = j.point ? j.point.id : null;
    await loadPoints();
    discStatus.textContent = t("점 '{name}' 추가 ({x},{y}).", { name: j.point.name, x, y });
  } catch (e) { discStatus.textContent = t("점 추가 실패") + ": " + e.message; }
}
async function renamePointTo(q, name) {
  name = String(name || "").trim();
  if (!name || name === q.name) { renderPointProps(); return; }
  try { await reqJson("PUT", api("/discovery/presets/") + discSelPresetId + "/points/" + q.id, { name }); await loadPoints(); }
  catch (e) { discStatus.textContent = t("이름 변경 실패") + ": " + e.message; }
}
async function deletePoint(id) {
  try {
    await reqJson("DELETE", api("/discovery/presets/") + discSelPresetId + "/points/" + id);
    if (discSelPointId === id) discSelPointId = null;
    await loadPoints();
  } catch (e) { discStatus.textContent = t("삭제 실패") + ": " + e.message; }
}
async function aimPoint(q) {
  setBusy(true, "조준 중…");
  try {
    const j = await postJson(api("/center"), { x: q.x, y: q.y, frameWidth: 1920, frameHeight: 1080 });
    if (j.ptz) { lastPtz = j.ptz; ptzEl.textContent = fmt(j.ptz); }
    discStatus.textContent = t("'{name}' 조준.", { name: q.name });
  } catch (e) { discStatus.textContent = t("조준 실패") + ": " + e.message; }
  finally { setBusy(false); }
}
// 영상 클릭 = 점 추가 (점 위 클릭은 selectPoint가 mousedown에서 가로챔)
discView.addEventListener("dragstart", (e) => e.preventDefault());
discView.addEventListener("click", (e) => { const p = dpt(e); addPoint(p.x, p.y); });


document.getElementById("disc-add").addEventListener("click", addDiscPreset);
document.getElementById("disc-vlm").addEventListener("click", vlmAutoDetect);
document.getElementById("disc-home-start").addEventListener("click", startHoming);
document.getElementById("disc-home-stop").addEventListener("click", stopHoming);
document.getElementById("disc-clear").addEventListener("click", clearAllPoints);

// 헤더 CCTV 셀렉터 — 활성 카메라는 서버 전역 상태다(설정 페이지와 공유).
// 전환은 **놓아주기부터**. 서버 활성을 먼저 바꾸면 이전 카메라로 열린 스트림이 유령
// 시청자로 남아 그 카메라가 유휴로 풀리지 않는다(cctv 와 같은 계약 — camera-select.mjs 주석).
// 그리고 자동 스냅샷 폴백은 직전 기기에 대한 판정이었으므로 새 기기에 물려주지 않는다:
// 스트림 없는 기기(기준기 → /api/stream 501)를 한 번 거치면 그대로 저fps 에 갇혔다.
const cam = createCameraSelect({
  select: document.getElementById("header-camera-select"),
  beforeChange: async () => {
    await discoveryPreview.stop();
    discoveryPreview.resetFallbackForNewDevice();
  },
  // 이 페이지는 프리뷰가 곧 작업 화면이라(아래 부트스트랩 주석) 전환 후 다시 켠다 —
  // cctv 와 달리 여기서는 켜 두는 것이 그 페이지의 계약이다.
  onChange: async () => { discoveryPreview.start(); await loadDiscovery(); },
  log,
  refreshOnVisible: true,
});
cam.load();

// 이 페이지는 영상 위에 점을 찍는 것이 본업이라 프리뷰가 켜져 있어야 성립한다 — 제어 콘솔의
// "열자마자 켜지 않는다" 규칙은 그쪽 계약이고, 여기서는 프리뷰가 곧 작업 화면이다.
discoveryPreview.start();
loadDiscovery();
loopPtz();

// 화면 이탈 시 스트림 즉시 종료 — 브라우저가 스트리밍 fetch 를 살려두어(bfcache 등)
// sim MJPEG 연결이 누적되는 것을 막는다.
window.addEventListener("pagehide", () => { discoveryPreview.stop(); });
</script>
